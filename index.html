<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>ArshUX OMNI | Rana Hamza</title>
  <style>
    :root { --neon:#00ffe7; --neon2:#bf00ff; --bg:#050508; --sur:#0d0d16; --text:#e0e6ed; --green:#00ff41; --red:#ff4060; --amber:#ffb300; --font:'Fira Code','Courier New',monospace; }
    [data-theme="matrix"] { --neon:#00ff41; --neon2:#72ff00; --bg:#020702; --sur:#071207; --text:#d9ffd9; --amber:#d7ff00; }
    [data-theme="cyberpunk"] { --neon:#00f6ff; --neon2:#ff00c8; --bg:#10051b; --sur:#1c0b2c; --text:#f6e9ff; --green:#92ff00; }
    [data-theme="dracula"] { --neon:#bd93f9; --neon2:#ff79c6; --bg:#282a36; --sur:#343746; --text:#f8f8f2; --green:#50fa7b; --amber:#f1fa8c; }
    [data-theme="ubuntu"] { --neon:#ff7a00; --neon2:#e95420; --bg:#2c001e; --sur:#3d0730; --text:#f7e8ee; --green:#8ae234; --amber:#fce94f; }
    [data-theme="hacker"] { --neon:#39ff14; --neon2:#39ff14; --bg:#000; --sur:#080808; --text:#c7ffc7; --green:#39ff14; --amber:#dfff00; }
    [data-theme="windows95"] { --neon:#fff; --neon2:#000080; --bg:#008080; --sur:#c0c0c0; --text:#000; --green:#008000; --red:#800000; --amber:#808000; }
    [data-theme="nord"] { --neon:#88c0d0; --neon2:#b48ead; --bg:#2e3440; --sur:#3b4252; --text:#eceff4; --green:#a3be8c; --red:#bf616a; --amber:#ebcb8b; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html { background:var(--bg); }
    body { min-height:100vh; min-height:100dvh; overflow:hidden; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:var(--font); }
    #hdr { display:flex; align-items:center; gap:10px; min-width:0; padding:calc(12px + env(safe-area-inset-top)) 12px 12px; background:color-mix(in srgb,var(--sur) 88%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid color-mix(in srgb,var(--neon) 20%,transparent); }
    #logo { flex:0 0 auto; color:var(--neon); font-size:16px; font-weight:bold; letter-spacing:2px; text-shadow:0 0 10px var(--neon); } #logo span { color:var(--neon2); }
    #tabs { display:flex; flex:1 1 auto; gap:8px; min-width:0; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:none; }
    .tab,.icon-button,.kb { border:1px solid color-mix(in srgb,var(--text) 14%,transparent); border-radius:4px; background:var(--sur); color:var(--text); font:inherit; cursor:pointer; }
    .tab { flex:0 0 auto; padding:5px 14px; font-size:11px; white-space:nowrap; } .tab.active { border-color:var(--neon); box-shadow:0 0 8px color-mix(in srgb,var(--neon) 35%,transparent); color:var(--neon); }
    .icon-button { flex:0 0 auto; min-width:32px; min-height:30px; border-style:dashed; border-color:var(--neon); color:var(--neon); font-size:18px; }
    #terminals { flex:1 1 auto; min-width:0; min-height:0; position:relative; overflow:hidden; } .pane { position:absolute; inset:0; display:none; min-width:0; padding:15px; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; } .pane.active { display:block; }
    .ln { margin-bottom:5px; font-size:13px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; animation:fade-in .18s ease; } .ok { color:var(--green); } .err { color:var(--red); } .sys { color:var(--neon2); } .warn { color:var(--amber); } .muted { opacity:.72; } @keyframes fade-in { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    #suggestions { flex:0 0 auto; min-height:0; padding:0 15px; background:var(--sur); color:var(--amber); font-size:12px; line-height:1.5; } #suggestions:empty { display:none; }
    #keybar { display:flex; flex:0 0 auto; gap:5px; min-width:0; overflow-x:auto; overscroll-behavior-x:contain; padding:8px max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left)); background:#000; border-top:1px solid #111; scrollbar-width:none; }
    .kb { flex:0 0 auto; min-height:34px; padding:5px 11px; font-size:12px; color:var(--text); } .kb:active { color:#000; background:var(--neon); }
    #inputWrap { display:flex; flex:0 0 auto; align-items:center; min-width:0; padding:10px 15px calc(10px + env(safe-area-inset-bottom)); background:var(--sur); border-top:1px solid color-mix(in srgb,var(--text) 8%,transparent); } .prompt { flex:0 1 auto; max-width:42%; margin-right:10px; overflow:hidden; color:var(--neon); font-weight:bold; text-overflow:ellipsis; white-space:nowrap; } #cmdIn { flex:1 1 auto; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:16px var(--font); }
    button:focus-visible,#cmdIn:focus-visible { outline:2px solid var(--neon); outline-offset:2px; }
    #editor { width:min(900px,calc(100vw - 24px)); height:min(80dvh,700px); border:1px solid var(--neon); background:var(--sur); color:var(--text); padding:0; } #editor::backdrop { background:rgba(0,0,0,.7); } #editor form { height:100%; display:flex; flex-direction:column; } #editor header,#editor footer { display:flex; align-items:center; gap:10px; padding:10px; } #editor header input { flex:1; border:0; background:transparent; color:var(--neon); font:inherit; } #editor textarea { flex:1; resize:none; border:0; border-top:1px solid color-mix(in srgb,var(--text) 15%,transparent); border-bottom:1px solid color-mix(in srgb,var(--text) 15%,transparent); outline:0; padding:12px; background:#050508; color:var(--text); font:14px var(--font); line-height:1.5; } #editor footer { justify-content:flex-end; } #editor button { padding:7px 12px; border:1px solid var(--neon); background:var(--sur); color:var(--text); font:inherit; cursor:pointer; }
    @media (max-width:480px) { #hdr { gap:6px; padding:calc(8px + env(safe-area-inset-top)) 8px 8px; } #logo { font-size:13px; letter-spacing:1px; } #tabs { gap:5px; } .tab { padding:5px 9px; } .pane { padding:10px; } .ln { font-size:12px; line-height:1.5; } #suggestions { padding:0 10px; } #inputWrap { padding:9px 10px calc(9px + env(safe-area-inset-bottom)); } .prompt { margin-right:7px; } #keybar { padding-top:6px; padding-bottom:6px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <header id="hdr"><div id="logo" aria-label="ArshUX Omni">ARSHUX<span>OMNI</span></div><nav id="tabs" aria-label="Terminal sessions"></nav><button id="newTab" class="icon-button" type="button" aria-label="Open new terminal tab" title="Open new terminal tab">+</button></header>
  <main id="terminals" aria-label="Terminal output" aria-live="polite"></main>
  <div id="suggestions" aria-live="polite"></div>
  <div id="keybar" aria-label="Terminal special keys"><button class="kb" type="button" data-key="Tab">TAB</button><button class="kb" type="button" data-key="ArrowUp">UP</button><button class="kb" type="button" data-key="ArrowDown">DOWN</button><button class="kb" type="button" data-insert="|">|</button><button class="kb" type="button" data-insert=" && ">&amp;&amp;</button><button class="kb" type="button" data-insert=" > ">&gt;</button><button class="kb" type="button" data-key="Escape">ESC</button><button class="kb" type="button" data-key="CtrlC">CTRL+C</button></div>
  <div id="inputWrap"><span class="prompt" id="currentDir">~ ❯</span><input id="cmdIn" type="text" aria-label="Terminal command" enterkeyhint="send" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
  <dialog id="editor" aria-label="File editor"><form method="dialog"><header><strong>Editor</strong><input id="editorPath" aria-label="Editor file path" readonly></header><textarea id="editorText" aria-label="File contents" spellcheck="false"></textarea><footer><button id="editorCancel" value="cancel" type="button">Cancel</button><button id="editorSave" value="default" type="button">Save</button></footer></form></dialog>
  <script src="app.js" defer></script>
</body>
</html>
